[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Must stay compatible with AGPL-3.0-only. Extend deliberately when a new dependency needs it.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
