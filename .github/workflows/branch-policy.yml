name: Branch policy

# Required check on main: only development and hotfix/* from this repository may target it.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - env:
          # Through env, never inline: branch names are attacker-controlled.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Pull requests from forks must target development, not main."
            exit 1
          fi
          if [[ "$HEAD_REF" != development && "$HEAD_REF" != hotfix/* ]]; then
            echo "::error::Only development and hotfix/* may target main. Retarget this pull request to development."
            exit 1
          fi
